<svg xmlns="http://www.w3.org/2000/svg" width="730" height="390">

  <style>
    .node {
    fill: #ffffff;
    stroke: #000000;
    stroke-width: 1.8;
    }
    text {
    font-family: Arial, sans-serif;
    font-size: 15px;
    text-anchor: middle;
    dominant-baseline: middle;
    fill: #000000;
    }
    .line {
    stroke: #000000;
    stroke-width: 1.6;
    }
  </style>

  <g transform="translate(-160,0)">

    <!-- Document -->
    <rect class="node" x="380" y="20" width="140" height="40" />
    <text x="450" y="40">Document</text>
    <line class="line" x1="450" y1="60" x2="450" y2="90" />

    <!-- Root element -->
    <rect class="node" x="350" y="90" width="200" height="40" />
    <text x="450" y="110">Root element: &lt;html&gt;</text>

    <!-- Split into head and body -->
    <line class="line" x1="450" y1="130" x2="250" y2="170" />
    <line class="line" x1="450" y1="130" x2="650" y2="170" />

    <!-- head -->
    <rect class="node" x="190" y="170" width="120" height="40" />
    <text x="250" y="190">Element: &lt;head&gt;</text>

    <!-- body -->
    <rect class="node" x="610" y="170" width="120" height="40" />
    <text x="670" y="190">Element: &lt;body&gt;</text>

    <!-- head -> title -->
    <line class="line" x1="250" y1="210" x2="250" y2="250" />
    <rect class="node" x="190" y="250" width="120" height="40" />
    <text x="250" y="270">Element: &lt;title&gt;</text>

    <line class="line" x1="250" y1="290" x2="250" y2="330" />
    <rect class="node" x="190" y="330" width="120" height="40" />
    <text x="250" y="350">Text: "My title"</text>

    <!-- body splits -->
    <line class="line" x1="670" y1="210" x2="540" y2="250" />
    <line class="line" x1="670" y1="210" x2="800" y2="250" />

    <!-- href attribute -->
    <rect class="node" x="480" y="250" width="120" height="40" />
    <text x="540" y="270">Attribute: "href"</text>

    <!-- a element -->
    <rect class="node" x="610" y="250" width="120" height="40" />
    <text x="670" y="270">Element: &lt;a&gt;</text>

    <!-- h1 element -->
    <rect class="node" x="740" y="250" width="120" height="40" />
    <text x="800" y="270">Element: &lt;h1&gt;</text>

    <!-- Text under <a> -->
    <line class="line" x1="670" y1="290" x2="670" y2="330" />
    <rect class="node" x="610" y="330" width="120" height="40" />
    <text x="670" y="350">Text: "My link"</text>

    <!-- Text under <h1> -->
    <line class="line" x1="800" y1="290" x2="800" y2="330" />
    <rect class="node" x="738" y="330" width="125" height="40" />
    <text x="800" y="350">Text: "My header"</text>

  </g>
</svg>
